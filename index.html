html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f0;font-family:'Courier New',monospace;transition:background .5s ease;touch-action:none;-webkit-tap-highlight-color:transparent}

<script type="module">
import * as THREE from 'three';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const save = (k, v) => { try { localStorage.setItem('ascii-char-' + k, v); } catch (e) {} };

/* ---------- renderer: WebGL draws small, JS turns pixels into glyphs on a 2D canvas ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) { $('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(1);
renderer.setClearAlpha(0);

const scene = new THREE.Scene();
const FOV = 38, TAN = Math.tan(FOV / 2 * Math.PI / 180);
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4);  key.position.set(2, 3, 4);   scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.65); rim.position.set(-3, 1.5, -2); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(0, -3, 2);  scene.add(fill);

/* ---------- character ---------- */
const std = (color, roughness = 0.6, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
const bodyGroup = new THREE.Group(), headGroup = new THREE.Group();
headGroup.position.set(0, -1.02, 0);
bodyGroup.add(headGroup); scene.add(bodyGroup);
const put = (parent, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };

put(bodyGroup, new THREE.CylinderGeometry(0.35, 0.42, 0.35, 20), std(0xbbbbbb), 0, -1.02, 0);
const torso = put(bodyGroup, new THREE.SphereGeometry(1, 28, 20), std(0xcacaca, 0.6, { metalness: 0.08 }), 0, -2.15, 0);
torso.scale.set(1.35, 1.25, 0.95);
const shGeo = new THREE.SphereGeometry(0.42, 18, 14), shMat = std(0xb8b8b8, 0.55);
put(bodyGroup, shGeo, shMat, -1.25, -1.75, 0); put(bodyGroup, shGeo, shMat, 1.25, -1.75, 0);

const armGeo = new THREE.CapsuleGeometry(0.17, 0.85, 4, 10), armMat = std(0xb2b2b2, 0.6, { metalness: 0.05 });
const mkArm = (x, rz, ax) => {
  const p = new THREE.Group(); p.position.set(x, -1.75, 0); p.rotation.z = rz; bodyGroup.add(p);
  put(p, armGeo, armMat, ax, -0.52, 0); return p;
};
const leftArm = mkArm(-1.25, 0.15, -0.05), rightArm = mkArm(1.25, -0.15, 0.05);

put(bodyGroup, new THREE.BoxGeometry(1, 0.75, 0.12), std(0x2a2a2a, 0.35, { metalness: 0.5 }), 0, -2.15, 1.05);
const ledGeo = new THREE.SphereGeometry(0.075, 12, 10);
const ledMats = [0xff3355, 0x33ff88, 0x33bbff].map((c, i) => {
  const m = std(c, 0.4, { emissive: c, emissiveIntensity: 0.9 });
  put(bodyGroup, ledGeo, m, (i - 1) * 0.28, -2.15, 1.13); return m;
});

const head = put(headGroup, new THREE.SphereGeometry(1.05, 40, 28), std(0xdddddd, 0.55, { metalness: 0.05 }), 0, 1.02, 0);
head.scale.set(1.05, 0.98, 1);

const sockGeo = new THREE.SphereGeometry(0.3, 24, 18), sockMat = std(0xffffff, 0.9);
const lSock = put(headGroup, sockGeo, sockMat, -0.42, 1.2, 0.86), rSock = put(headGroup, sockGeo, sockMat, 0.42, 1.2, 0.86);
const pupGeo = new THREE.SphereGeometry(0.15, 18, 14), pupMat = std(0x111111, 0.25, { metalness: 0.1 });
const lPup = put(headGroup, pupGeo, pupMat, -0.42, 1.2, 1.02), rPup = put(headGroup, pupGeo, pupMat, 0.42, 1.2, 1.02);
const glintGeo = new THREE.SphereGeometry(0.05, 8, 8), glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
put(lPup, glintGeo, glintMat, -0.05, 0.06, 0.12); put(rPup, glintGeo, glintMat, -0.05, 0.06, 0.12);

const browGeo = new THREE.BoxGeometry(0.34, 0.055, 0.08), browMat = std(0x666666, 0.7);
const lBrow = put(headGroup, browGeo, browMat, -0.42, 1.57, 0.98), rBrow = put(headGroup, browGeo, browMat, 0.42, 1.57, 0.98);
const nose = put(headGroup, new THREE.ConeGeometry(0.09, 0.18, 12), std(0xaaaaaa, 0.7), 0, 1.0, 1.02);
nose.rotation.x = Math.PI / 2;
const cheekGeo = new THREE.SphereGeometry(0.14, 12, 10), cheekMat = std(0xffffff, 0.95, { transparent: true, opacity: 0.85 });
put(headGroup, cheekGeo, cheekMat, -0.65, 0.88, 0.82); put(headGroup, cheekGeo, cheekMat, 0.65, 0.88, 0.82);
const mouth = put(headGroup, new THREE.TorusGeometry(0.18, 0.03, 8, 24, Math.PI), std(0x555555, 0.8), 0, 0.67, 0.95);
mouth.rotation.set(-0.35, 0, Math.PI);
const antStick = put(headGroup, new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), std(0x888888), 0, 2.3, 0);
const antBall = put(headGroup, new THREE.SphereGeometry(0.11, 14, 10), std(0x333333, 0.3, { metalness: 0.4 }), 0, 2.6, 0);
const earGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.12, 14), earMat = std(0x999999, 0.5);
put(headGroup, earGeo, earMat, -1.08, 1.02, 0).rotation.z = Math.PI / 2;
put(headGroup, earGeo, earMat, 1.08, 1.02, 0).rotation.z = Math.PI / 2;

/* ---------- emotions (compact table) ---------- */
const P = Math.PI;
const KEYS = ['bLy','bLr','bRy','bRr','mRot','msx','msy','my','hty','htx','hbx','ant','eye','eL','eR'];
const EMO = {};
Object.entries({
  neutral:  [1.57,-.15,1.57, .15,P,1,1,.67,.10,.06,0,2.4,1,1,1,0x111111],
  happy:    [1.62,-.28,1.62, .28,P,1.35,1.55,.72,.16,.06,-.03,4.5,1,1,1,0x111111],
  sad:      [1.62,-.42,1.62, .42,0,1,.9,.62,.05,.10,.18,1,.8,1,1,0x111111],
  angry:    [1.54, .32,1.54,-.32,P,1.2,.35,.64,.06,.08,.05,7,.85,1,1,0x220000],
  surprised:[1.72,-.03,1.72, .03,P,.55,1.9,.7,.05,.05,-.02,9,1.15,1,1,0x111111],
  sleepy:   [1.52,-.08,1.52, .08,P,.75,.25,.64,.05,.06,.22,.5,.28,1,1,0x111111],
  love:     [1.64,-.22,1.64, .22,P,1.25,1.7,.72,.13,.05,-.02,5.5,1.05,1,1,0xdd3366],
  wink:     [1.64,-.3,1.55, .1,P,1.1,1.25,.7,.12,.05,-.06,3.4,1,1,.08,0x111111],
  confused: [1.72,-.05,1.5, .28,P,.8,.55,.6,.06,.07,.12,1.4,1.05,1,1,0x111111],
  smug:     [1.58,-.32,1.66,.05,P,1.2,.75,.66,.15,.05,-.05,2,1,.75,1,0x111111],
  thinking: [1.74,-.02,1.48,.26,P,.62,.48,.62,.08,.10,.14,1.6,.95,1,1,0x111111],
  giggle:   [1.68,-.36,1.68,.36,P,1.55,1.3,.74,.15,.07,-.05,6.8,.62,1,1,0x111111]
}).forEach(([n, a]) => {
  const o = {}; KEYS.forEach((k, i) => o[k] = a[i]); o.pup = new THREE.Color(a[15]); EMO[n] = o;
});
const EMO_NAMES = Object.keys(EMO);
const SPR = { hty:[120,20], htx:[120,20], hbx:[120,20], ant:[60,14], eye:[260,26], eL:[260,26], eR:[260,26] };

const anim = {}, vel = {};
KEYS.forEach(k => { anim[k] = EMO.neutral[k]; vel[k] = 0; });
const pupNow = new THREE.Color(0x111111);
let target = EMO.neutral, curEmotion = 'neutral';

function setEmotion(name, persist = true) {
  if (!EMO[name]) return;
  target = EMO[name]; curEmotion = name;
  if (persist) save('emotion', name);
  document.querySelectorAll('#emotion-row button').forEach(b => b.classList.toggle('active', b.dataset.k === name));
}

/* ---------- themes ---------- */
const CLASSIC = ' .\'`^",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
const THEMES = {
  paper:     { bg:'#f4f4f0', fg:'#0a0a0a', ramp:CLASSIC, vig:.10, light:true },
  aurora:    { bg:'#04121a', fg:'#1fa88a', hi:'#e6fff3', ramp:' .·+*○✦✧', vig:.45, amb:'stars' },
  starfield: { bg:'#05060d', fg:'#ffffff', ramp:' .·+*○●', vig:.55, amb:'stars' },
  nebula:    { bg:'#07020f', fg:'#8a4fd0', hi:'#f8e8ff', ramp:' .·•✦✧*', vig:.50, amb:'stars' },
  vaporwave: { bg:'#2b0b42', fg:'#ff5fb8', hi:'#fff1d6', ramp:' .·•○◎●', vig:.35 },
  cyberpunk: { bg:'#05000d', fg:'#0b8f79', hi:'#8dfff0', ramp:' .:-=+*#%@░▒▓█', vig:.55, amb:'rain' },
  matrix:    { bg:'#000502', fg:'#2bff6a', ramp:' .:-=+*#%@', vig:.60, amb:'rain' },
  sunset:    { bg:'#1b0430', fg:'#ff6a5c', hi:'#fff0c8', ramp:' .·:;*oO@', vig:.35 },
  midnight:  { bg:'#0a0f24', fg:'#dfe9ff', ramp:' .·+*○●', vig:.55, amb:'stars' },
  frost:     { bg:'#dbeefb', fg:'#002244', ramp:' .·:+*#', vig:.05, light:true }
};
const DENS = { coarse: 18, normal: 14, fine: 10 };   // font size in CSS px
let themeName = 'paper', theme = THEMES.paper, densName = 'normal';

/* ---------- ASCII canvas ---------- */
const view = $('view'), ctx = view.getContext('2d');
const scratch = document.createElement('canvas');
const sctx = scratch.getContext('2d', { willReadFrequently: true });
const atlas = document.createElement('canvas'), actx = atlas.getContext('2d');
const STEPS = 12;
let cw, ch, cols, rows, SS = 2, glyphN = 1, vivid = false, ready = false;

function buildAtlas() {
  const glyphs = Array.from(theme.ramp);
  glyphN = glyphs.length; vivid = !!theme.hi;
  const steps = vivid ? STEPS : 1;
  atlas.width = glyphN * cw; atlas.height = steps * ch;
  actx.clearRect(0, 0, atlas.width, atlas.height);
  actx.font = `${ch}px "Courier New", Courier, monospace`;
  actx.textAlign = 'center'; actx.textBaseline = 'middle';
  const a = new THREE.Color(theme.fg), b = new THREE.Color(theme.hi || theme.fg);
  for (let s = 0; s < steps; s++) {
    actx.fillStyle = vivid ? a.clone().lerp(b, s / (steps - 1)).getStyle() : theme.fg;
    glyphs.forEach((g, i) => actx.fillText(g, i * cw + cw / 2, s * ch + ch * 0.54));
  }
}

function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2), fp = DENS[densName] * dpr;
  ch = Math.round(fp); cw = Math.max(3, Math.round(fp * 0.6));
  cols = Math.ceil(innerWidth * dpr / cw); rows = Math.ceil(innerHeight * dpr / ch);
  view.width = cols * cw; view.height = rows * ch;
  view.style.width = view.width / dpr + 'px'; view.style.height = view.height / dpr + 'px';
  scratch.width = cols; scratch.height = rows;
  renderer.setSize(cols * SS, rows * SS, false);
  camera.aspect = (cols * cw) / (rows * ch);
  camera.position.set(0, 0.05, Math.max(6.4, 2.9 / (TAN * camera.aspect)));
  camera.lookAt(0, -0.3, 0);
  camera.updateProjectionMatrix();
  buildAtlas(); ready = true;
}

function setTheme(name, persist = true) {
  const t = THEMES[name]; if (!t) return;
  themeName = name; theme = t;
  document.body.style.background = t.bg;
  document.documentElement.style.setProperty('--hint', t.light ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.55)');
  $('vignette').style.opacity = t.vig;
  if (ready) buildAtlas();
  if (persist) save('theme', name);
  document.querySelectorAll('#theme-row button').forEach(b => b.classList.toggle('active', b.dataset.k === name));
}
function setDensity(name, persist = true) {
  if (!DENS[name]) return;
  densName = name; if (persist) save('density', name);
  layout();
  document.querySelectorAll('#density-row button').forEach(b => b.classList.toggle('active', b.dataset.k === name));
}

/* ---------- ambient background (stars / rain), stateless so it costs nothing to keep ---------- */
const hash = (a, b) => { let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
let heads = new Float32Array(0), lens = new Float32Array(0);
function prepAmbient(t) {
  if (theme.amb !== 'rain') return;
  if (heads.length !== cols) { heads = new Float32Array(cols); lens = new Float32Array(cols); }
  for (let c = 0; c < cols; c++) {
    const h = hash(c, 7), len = 6 + h * 12;
    lens[c] = len; heads[c] = (t * (5 + h * 11) + h * 1000) % (rows + len);
  }
}

/* ---------- UI ---------- */
const mkButtons = (rowId, names, fn) => names.forEach(n => {
  const b = document.createElement('button'); b.textContent = n; b.dataset.k = n;
  b.addEventListener('click', () => { fn(n); b.blur(); }); $(rowId).appendChild(b);
});
mkButtons('emotion-row', EMO_NAMES, n => setEmotion(n));
mkButtons('theme-row', Object.keys(THEMES), n => setTheme(n));
mkButtons('density-row', Object.keys(DENS), n => setDensity(n));

const panel = $('panel');
const togglePanel = () => panel.classList.toggle('hidden');
$('ui-toggle').addEventListener('click', e => { togglePanel(); e.currentTarget.blur(); });

function shuffle() {
  const pick = (list, cur) => { const o = list.filter(x => x !== cur); return o[Math.random() * o.length | 0]; };
  setTheme(pick(Object.keys(THEMES), themeName));
  setEmotion(pick(EMO_NAMES, curEmotion));
  triggerWave();
}
$('shuffle-btn').addEventListener('click', e => { shuffle(); e.currentTarget.blur(); });

{ // restore state
  const q = new URLSearchParams(location.search), get = (k, d) => { try { return q.get(k) || localStorage.getItem('ascii-char-' + k) || d; } catch (e) { return d; } };
  let e = get('emotion', 'neutral'), t = get('theme', 'paper'), d = get('density', 'normal');
  setEmotion(EMO[e] ? e : 'neutral', false);
  setTheme(THEMES[t] ? t : 'paper', false);
  setDensity(DENS[d] ? d : 'normal', false);
  if (innerWidth < 720) panel.classList.add('hidden');
}

/* ---------- input ---------- */
const mouseT = new THREE.Vector2(), mouseC = new THREE.Vector2();
let lastMove = performance.now();
addEventListener('pointermove', e => {
  mouseT.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  lastMove = performance.now();
});
document.documentElement.addEventListener('mouseleave', () => { mouseT.set(0, 0); lastMove = -1e9; });

const idle = { x: 0, y: 0, tx: 0, ty: 0, t: 0 };
function updateIdle(dt) {
  if (!REDUCED && performance.now() - lastMove > 2200) {
    if ((idle.t -= dt) <= 0) { idle.t = 1.6 + Math.random() * 2.6; idle.tx = (Math.random() - .5) * .85; idle.ty = (Math.random() - .5) * .45; }
  } else { idle.tx = idle.ty = 0; }
  const k = 1 - Math.pow(0.12, dt);
  idle.x += (idle.tx - idle.x) * k; idle.y += (idle.ty - idle.y) * k;
}

let waveStart = 0, waveEnd = 0;
function triggerWave() {
  const n = performance.now();
  if (n > waveEnd - 200) { waveStart = n; waveEnd = n + 1700; }
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let reaction = null, reactionUntil = 0, before = 'neutral', pulse = 0;
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('#panel, #ui-toggle')) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.intersectObject(bodyGroup, true).length) return;
  if (!reaction) before = curEmotion;
  const p = curEmotion;
  reaction = (p === 'angry' || p === 'sleepy') ? 'surprised' : (p === 'sad' || p === 'confused') ? 'happy' : 'giggle';
  reactionUntil = performance.now() + 1400;
  setEmotion(reaction, false);
  pulse = 1; triggerWave();
});

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, order = '1234567890-=', i = order.indexOf(k);
  if (i >= 0 && i < EMO_NAMES.length) return setEmotion(EMO_NAMES[i]);
  const L = k.toLowerCase();
  if (L === 't') { const n = Object.keys(THEMES); setTheme(n[(n.indexOf(themeName) + 1) % n.length]); }
  else if (L === 'd') { const n = Object.keys(DENS); setDensity(n[(n.indexOf(densName) + 1) % n.length]); }
  else if (L === 'r') shuffle();
  else if (L === 'h') togglePanel();
  else if (k === ' ') { e.preventDefault(); if (!blinking) { blinking = true; blinkP = 0; } }
});

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); });

/* ---------- animation state ---------- */
let blinkTimer = 0, nextBlink = 2 + Math.random() * 3, blinkP = 0, blinking = false, blinkMul = 1;
function updateBlink(dt) {
  blinkTimer += dt;
  if (!blinking && blinkTimer >= nextBlink) { blinking = true; blinkP = 0; }
  if (blinking) {
    blinkP += dt * 8;
    if (blinkP <= 1) blinkMul = 1 - Math.sin(blinkP * P);
    else { blinking = false; blinkTimer = 0; blinkMul = 1; nextBlink = (REDUCED ? 5 : 2) + Math.random() * (REDUCED ? 5 : 4); }
  }
  lSock.scale.y = lPup.scale.y = Math.max(anim.eye * blinkMul * anim.eL, 0.03);
  rSock.scale.y = rPup.scale.y = Math.max(anim.eye * blinkMul * anim.eR, 0.03);
}

const sac = { x: 0, y: 0, tx: 0, ty: 0, t: 0 };
function updateSaccade(dt) {
  if ((sac.t -= dt) <= 0) { sac.t = .4 + Math.random() * 1.6; sac.tx = (Math.random() - .5) * .06; sac.ty = (Math.random() - .5) * .05; }
  const k = 1 - Math.pow(0.001, dt);
  sac.x += (sac.tx - sac.x) * k; sac.y += (sac.ty - sac.y) * k;
}

function stepAnim(dt) {
  const sub = dt > 1 / 90 ? 2 : 1, h = dt / sub;       // substeps keep springs stable on slow frames
  for (let s = 0; s < sub; s++) for (const k of KEYS) {
    const [S, D] = SPR[k] || [200, 24];
    vel[k] += ((target[k] - anim[k]) * S - vel[k] * D) * h;
    anim[k] += vel[k] * h;
  }
  pupNow.lerp(target.pup, 1 - Math.pow(0.001, dt));
  pupMat.color.copy(pupNow);
}

/* ---------- ascii draw ---------- */
function drawAscii(t) {
  sctx.clearRect(0, 0, cols, rows);
  sctx.drawImage(renderer.domElement, 0, 0, cols, rows);   // 2x supersample -> box filtered
  const d = sctx.getImageData(0, 0, cols, rows).data;
  ctx.clearRect(0, 0, view.width, view.height);
  const n1 = glyphN - 1, light = !!theme.light, amb = theme.amb;
  prepAmbient(t);
  let curA = 1;
  for (let r = 0, i = 0; r < rows; r++) {
    const y = r * ch;
    for (let c = 0; c < cols; c++, i += 4) {
      const a = d[i + 3];
      if (a > 50) {
        const lum = (d[i] * .2126 + d[i + 1] * .7152 + d[i + 2] * .0722) / 255;
        const l = clamp((lum - .06) / .8, 0, 1);
        const gi = Math.max(1, Math.round((light ? 1 - l : l) * n1));
        if (curA !== 1) { ctx.globalAlpha = curA = 1; }
        ctx.drawImage(atlas, gi * cw, vivid ? Math.min(STEPS - 1, l * STEPS | 0) * ch : 0, cw, ch, c * cw, y, cw, ch);
      } else if (amb) {
        let gi = 0, al = 0, st = 0;
        if (amb === 'stars') {
          const h = hash(c, r);
          if (h < .012) { const tw = .5 + .5 * Math.sin(t * (1 + h * 300) + h * 100); gi = 1 + (tw * Math.min(n1 - 1, 3) | 0); al = .3 + .6 * tw; st = tw * (STEPS - 1) | 0; }
        } else {
          const dd = heads[c] - r;
          if (dd >= 0 && dd < lens[c]) { const lv = 1 - dd / lens[c]; gi = 1 + (hash(c, r + (t * 8 | 0)) * n1 | 0); gi = Math.min(gi, n1); al = lv * .75; st = lv * (STEPS - 1) | 0; }
        }
        if (gi) {
          if (curA !== al) ctx.globalAlpha = curA = al;
          ctx.drawImage(atlas, gi * cw, vivid ? st * ch : 0, cw, ch, c * cw, y, cw, ch);
        }
      }
    }
  }
  if (curA !== 1) ctx.globalAlpha = 1;
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
let phase = 0, ledPhase = 0, cost = 8;
function frame() {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;

  if (reaction && t0 > reactionUntil) { const r = reaction; reaction = null; if (curEmotion === r) setEmotion(before, false); }

  mouseC.x += (mouseT.x - mouseC.x) * (1 - Math.pow(0.0015, dt));
  mouseC.y += (mouseT.y - mouseC.y) * (1 - Math.pow(0.0015, dt));
  updateIdle(dt); stepAnim(dt); updateBlink(dt);
  if (!REDUCED) updateSaccade(dt);

  const lx = mouseC.x + idle.x, ly = mouseC.y + idle.y, off = 0.13;
  const px = lx * off + sac.x, py = ly * off + sac.y;
  lPup.position.set(lSock.position.x + px, lSock.position.y + py, lPup.position.z);
  rPup.position.set(rSock.position.x + px, rSock.position.y + py, rPup.position.z);

  lBrow.position.y = anim.bLy; rBrow.position.y = anim.bRy;
  lBrow.rotation.z = anim.bLr; rBrow.rotation.z = anim.bRr;
  mouth.rotation.z = anim.mRot; mouth.scale.set(anim.msx, anim.msy, 1); mouth.position.y = anim.my;

  headGroup.rotation.y = lx * anim.hty;
  headGroup.rotation.x = -ly * anim.htx + anim.hbx;
  bodyGroup.rotation.y = lx * 0.045;

  pulse *= Math.pow(0.002, dt);
  headGroup.scale.setScalar(1 + pulse * 0.08);

  if (!REDUCED) {
    bodyGroup.position.set(Math.sin(t * .7) * .02, Math.sin(t * 1.2) * .06, 0);
    const b = 1 + Math.sin(t * 1.1) * .015;
    torso.scale.set(1.35 * b, 1.25 * b, .95 * b);
  }

  phase += dt * anim.ant;
  antBall.position.x = Math.sin(phase) * .03;
  antStick.rotation.z = Math.sin(phase) * .04;

  if (t0 < waveEnd) {
    const el = (t0 - waveStart) / 1000, rem = (waveEnd - t0) / 1000;
    const env = Math.min(1, el / .28, rem / .45);
    rightArm.rotation.z = -.15 + (-2.05 + .15) * env + Math.sin(el * 18) * .35 * env;
    leftArm.rotation.z = .15 + Math.sin(t) * .05;
  } else {
    rightArm.rotation.z = -.15 + Math.sin(t * .9 + .7) * .05;
    leftArm.rotation.z = .15 + Math.sin(t * .9) * .05;
  }

  ledPhase += dt * (3 + anim.ant * .25);
  ledMats.forEach((m, i) => m.emissiveIntensity = .6 + Math.sin(ledPhase + i * 1.5) * .4);

  renderer.render(scene, camera);
  drawAscii(t);

  // auto quality: drop supersampling if this device can't keep up
  cost += (performance.now() - t0 - cost) * .05;
  if (cost > 22 && SS > 1) { SS = 1; cost = 8; layout(); }
}
frame();
</script>
